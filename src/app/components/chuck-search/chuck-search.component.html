<div class="chuck-hero">
  <div class="chuck-hero__bg"></div>

  <div class="chuck-hero__body">
    <!-- Image -->
    <div class="chuck-hero__image-wrapper">
      <div class="chuck-hero__image-ring"></div>
      <img
        src="super_chuck_norris2.png"
        alt="Chuck Norris"
        class="chuck-hero__image"
        loading="eager"
      />
    </div>

    <!-- Copy -->
    <div class="chuck-hero__copy">
      <span class="chuck-hero__eyebrow">The official generator</span>
      <h1 class="chuck-hero__title">
        Chuck Norris<br>
        <span class="chuck-hero__title--accent">Facts</span>
      </h1>

      @if (jokeService.randomJoke().joke !== '') {
        <div class="chuck-joke-inline">
          <i class="bi bi-quote chuck-joke-inline__quote"></i>
          <p class="chuck-joke-inline__text">{{ jokeService.randomJoke().joke }}</p>
        </div>
      } @else {
        <p class="chuck-hero__lead">
          Chuck Norris doesn't need the Internet.<br>
          But you do. So enjoy it.
        </p>
      }

      <button
        class="chuck-btn"
        [class.chuck-btn--loading]="jokeService.loading()"
        (click)="jokeService.getRandomJoke()"
        [disabled]="jokeService.loading()">
        @if (jokeService.loading()) {
          <span class="chuck-btn__spinner"></span>
          <span>Loading...</span>
        } @else if (jokeService.randomJoke().joke !== '') {
          <i class="bi bi-arrow-clockwise"></i>
          <span>Another one</span>
        } @else {
          <i class="bi bi-lightning-charge-fill"></i>
          <span>Generate a fact</span>
        }
      </button>
    </div>
  </div>
</div>

<header>
  <nav class="site-nav" aria-label="Main navigation">
    <div class="container-xxl">
      <div class="site-nav__inner">

        <!-- Brand -->
        <a class="site-nav__brand" routerLink="/" aria-label="Chuck Norris Facts - Home">
          <img
            src="chuck-logo.png"
            width="52"
            height="52"
            alt="Chuck Norris Logo"
            loading="eager"
            class="site-nav__logo"
          />
          <span class="site-nav__brand-name">
            Chuck<span class="site-nav__brand-accent">Facts</span>
          </span>
        </a>

        <!-- Links -->
        <ul class="site-nav__links">
          @if (isAdmin$ | async) {
            <li>
              <a class="site-nav__link site-nav__link--admin" routerLink="/admin-joke">
                <i class="bi bi-shield-fill-check me-1"></i>
                Administration
                <span class="admin-pill">ADMIN</span>
              </a>
            </li>
          }
          <li>
            <a class="site-nav__link" routerLink="/admin-protected">
              <i class="bi bi-person-circle me-1"></i>
              My Profile
            </a>
          </li>
        </ul>

        <!-- User / Auth -->
        <div class="site-nav__user">
          @if (isAuthenticated$ | async) {
            <div class="user-menu">
              <button class="user-menu__trigger" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="user-avatar">
                  {{ (userName$ | async)?.charAt(0)?.toUpperCase() || 'U' }}
                </div>
                <span class="user-menu__name">{{ userName$ | async }}</span>
                <i class="bi bi-chevron-down user-menu__chevron"></i>
              </button>
              <ul class="dropdown-menu dropdown-menu-end user-dropdown">
                <li class="user-dropdown__header">
                  <span class="user-dropdown__label">Logged in as</span>
                  <strong class="user-dropdown__name">{{ userName$ | async }}</strong>
                  @if (isAdmin$ | async) {
                    <span class="user-dropdown__admin-badge">
                      <i class="bi bi-shield-fill-check me-1"></i>Administrator
                    </span>
                  }
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                  <button class="dropdown-item user-dropdown__logout" type="button" (click)="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i>Log out
                  </button>
                </li>
              </ul>
            </div>
          } @else {
            <button class="btn-login" type="button" (click)="login()">
              <i class="bi bi-person-fill me-2"></i>
              Log in
            </button>
          }
        </div>

      </div>
    </div>
  </nav>
</header>
